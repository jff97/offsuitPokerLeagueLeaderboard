name: Email Bar List Report

on:
  schedule:
    # 15th of every month at 10:00 AM CT → 4:00 PM UTC
    - cron: '0 16 15 * *'
  workflow_dispatch:

jobs:
  email-bar-list:
    runs-on: ubuntu-latest
    steps:
      - name: Hit email bar list endpoint
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_AUTH_TOKEN }}" \
            https://api.johnfoxweb.com/api/admin/emailbarlist)
          echo "Status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Request failed"
            exit 1
          fi
