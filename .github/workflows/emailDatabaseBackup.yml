name: Email Database Backup

on:
  schedule:
    # Twice a month: 1st and 15th at 3:00 AM UTC
    - cron: '0 3 1 * *'
    - cron: '0 3 15 * *'
  workflow_dispatch:

jobs:
  warmup:
    uses: ./.github/workflows/warmup-api.yml

  email-backup:
    needs: warmup
    runs-on: ubuntu-latest
    steps:
      - name: Hit email backup endpoint
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_AUTH_TOKEN }}" \
            https://api.johnfoxweb.com/api/admin/emailroundbackup)
          echo "Status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "Request failed"
            exit 1
          fi
