[tool.poetry]
name = "offsuit-analyzer"
version = "0.1.0"
description = "Poker tournament analytics and scraping system"
authors = ["John Fox <jicfox7@gmail.com>"]
readme = "readme.md"
packages = [{ include = "offsuit_analyzer"}]
repository = "https://github.com/jff97/pokerScraper"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
flask = "*"
flask-httpauth = "*"
pymongo = "*"
requests = "*"
numpy = "*"
pandas = "*"
rapidfuzz = "*"
trueskill = "*"
flask_cors = "*"
cryptography = "*"
# DISABLED: networkx removed for deployment size optimization
# networkx = "*"
# DISABLED: matplotlib removed for deployment size optimization
# matplotlib = "*"
# DISABLED: python-louvain removed for deployment size optimization
# python-louvain = "^0.16"
scipy = "*"
pytz = "*"

[tool.poetry.scripts]
offsuit-analyzer = "offsuit_analyzer.web.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
